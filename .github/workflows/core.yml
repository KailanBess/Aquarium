name: Portable Aquarium Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Aquarium.CoreTests -c Release

      - run: dotnet run --project tests/Aquarium.MonitorTests -c Release
      - run: dotnet run --project tests/Aquarium.SystemCenterTests -c Release

      - run: dotnet run --project tests/Aquarium.TextEditorTests -c Release
      - run: dotnet run --project tests/Aquarium.FolderTests -c Release

      - run: dotnet run --project tests/Aquarium.FileComparisonTests -c Release
