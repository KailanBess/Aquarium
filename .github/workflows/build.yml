name: Windows build and complete app release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Test package safety and registry persistence
        run: dotnet run --project tests/Aquarium.PackageTests/Aquarium.PackageTests.csproj -c Release
      - name: Test resource measurement interpretation
        run: dotnet run --project tests/Aquarium.MonitorTests -c Release
      - name: Test generated-data native monitor UI
        run: dotnet run --project tests/Aquarium.MonitorUiTests -c Release
      - name: Test System Center adapters and generated-data native UI
        run: |
          dotnet run --project tests/Aquarium.SystemCenterTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Aquarium.SystemCenterUiTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test signing configuration guards without credentials
        shell: pwsh
        run: ./tests/Test-Signing.ps1
      - name: Test single-app extraction and integrity
        run: dotnet run --project tests/Aquarium.LauncherTests/Aquarium.LauncherTests.csproj -c Release
      - name: Publish Aquarium
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Project src/Aquarium/Aquarium.csproj -PublishDirectory artifacts/Aquarium -LogName aquarium-build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KailanBess/FishNet
          ref: f735725f1cdbb0810dfb76e30288fbaa41a33dc6
          path: companion/FishNet
      - name: Restore pinned shared Core for included FishNet
        shell: pwsh
        run: ./companion/FishNet/scripts/Restore-Core.ps1
      - name: Publish included FishNet 0.6.3 runtime
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Project companion/FishNet/src/FishNet/FishNet.csproj -PublishDirectory artifacts/FishNet -LogName fishnet-build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: KailanBess/FishTank
          ref: a284ccdcc4213a67df66b4e5e3fe5d74ce323276
          path: companion/FishTank
      - name: Validate included FishTank 0.18.0 Windows source
        shell: pwsh
        run: |
          $root=Join-Path $PWD 'companion/FishTank'
          dotnet run --project "$root/tests/Logic/Logic.csproj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project "$root/tests/Appearance/Appearance.csproj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach($suite in @('WindowsSecurity','WindowsUi','Resilience','Expansion')) {
            dotnet build "$root/tests/$suite/$suite.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $program=Join-Path $root "tests/$suite/bin/Release/net48/$suite.exe"
            if($suite -eq 'WindowsUi'){& $program "$PWD/artifacts/tank-ui"}else{& $program}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & "$root/scripts/Package-Preview.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and include companion packages
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && vars.WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          ./scripts/Test-Bundle.ps1 -FishNetDirectory artifacts/FishNet -FishTankArchive companion/FishTank/packages/FishTank-desktop-preview.zip
          ./scripts/Bundle-Apps.ps1 -PublishDirectory artifacts/Aquarium -FishNetDirectory artifacts/FishNet -FishTankArchive companion/FishTank/packages/FishTank-desktop-preview.zip
          [xml]$project=Get-Content src/Aquarium/Aquarium.csproj
          $tag='v'+[string]$project.Project.PropertyGroup.Version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag){throw 'Release tag/source mismatch.'}
          ./scripts/Package-Release.ps1 -PublishDirectory artifacts/Aquarium -OutputDirectory artifacts/release -Tag $tag
      - name: Publish and checksum standalone Windows tools
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && secrets.WINDOWS_SIGNING_PFX_BASE64 || '' }}
          WINDOWS_SIGNING_PASSWORD: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && vars.WINDOWS_TIMESTAMP_URL || '' }}
        run: |
          $checksums = foreach ($tool in @('FileOrganizer', 'DeviceInventory', 'WorkspaceLauncher', 'SystemMonitor', 'SystemCenter')) {
            $output = "artifacts/tools/$tool"
            dotnet publish "tools/$tool/$tool.csproj" -c Release -r win-x64 --self-contained true -o $output | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path -LiteralPath "$output/$tool.exe") -or !(Test-Path -LiteralPath "$output/coreclr.dll")) {
              throw "The standalone runtime for $tool is incomplete."
            }
            $toolSigned = ./scripts/Sign-Optional.ps1 -Files @("$output/$tool.exe", "$output/$tool.dll")
            $name = "$tool-windows-x64.zip"
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/release/$name"
            $sha = (Get-FileHash "artifacts/release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $name"
          }
          $checksums | Set-Content artifacts/release/SHA256SUMS-tools.txt -Encoding utf8NoBOM
      - name: Package reusable Aquarium Core
        shell: pwsh
        run: |
          dotnet pack src/Aquarium.Core/Aquarium.Core.csproj -c Release -o artifacts/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem artifacts/release/Aquarium.Core.*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one Core library package.' }
          $package = $packages[0]
          ((Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $package.Name) | Set-Content artifacts/release/SHA256SUMS-core.txt -Encoding ascii
      - name: Verify clean download and native startup
        shell: pwsh
        run: ./scripts/Test-SingleApp.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aquarium-complete-windows-x64
          path: artifacts/Aquarium-single-app/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aquarium-release
          path: artifacts/release/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || ((github.ref_type == 'tag' || github.ref == 'refs/heads/main') && startsWith(github.ref_name, 'v')))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require reviewed release source on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: Aquarium-release
          path: release
      - name: Verify and publish the complete Aquarium bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line=(Get-Content release/SHA256SUMS.txt).Trim()
          if($line -notmatch '^([a-f0-9]{64})  Aquarium-complete-windows-x64.zip$'){throw 'Invalid release manifest.'}
          if((Get-FileHash release/Aquarium-complete-windows-x64.zip -Algorithm SHA256).Hash -ne $Matches[1]){throw 'Release archive digest mismatch.'}
          $toolAssets = @()
          $toolManifest = @(Get-Content release/SHA256SUMS-tools.txt)
          if ($toolManifest.Count -ne 5) { throw 'Invalid tools checksum manifest.' }
          foreach ($tool in @('FileOrganizer', 'DeviceInventory', 'WorkspaceLauncher', 'SystemMonitor', 'SystemCenter')) {
            $name = "$tool-windows-x64.zip"
            $entry = @($toolManifest | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($name) + '$') })
            if ($entry.Count -ne 1) { throw "Missing checksum for $name" }
            $sha = (Get-FileHash "release/$name" -Algorithm SHA256).Hash
            if ($sha -ne $entry[0].Substring(0, 64)) { throw "Checksum failed for $name" }
            $toolAssets += "./release/$name"
          }
          $signature = if ((Get-Content release/BUILD-INFO.json -Raw | ConvertFrom-Json).signed) { 'Publisher-signed hub; timestamp and trust checks passed.' } else { 'Unsigned development hub; genuine publisher signing is not configured.' }
          $coreLine = (Get-Content release/SHA256SUMS-core.txt).Trim()
          if ($coreLine -notmatch '^([a-f0-9]{64})  (Aquarium\.Core\.\d+\.\d+\.\d+\.nupkg)$') { throw 'Invalid Core checksum manifest.' }
          $coreName = $Matches[2]
          if ((Get-FileHash "release/$coreName" -Algorithm SHA256).Hash -ne $Matches[1]) { throw 'Core package checksum mismatch.' }
          $notes="Aquarium 0.11.0 adds Core 0.4 bounded local fixed-code activity history and a Settings review/export flow. Retains optional independent System Center OS/runtime/physical-memory and account-visible Windows service observations, manual refresh and reviewed atomic JSON export. It changes no settings or services, does not query accounts or command lines and discards native process IDs, and explicitly distinguishes unsupported, unavailable, unknown and buffer-limited results. Service state is not a health/security verdict; Windows may omit services without query permission. Retains bounded in-memory CPU/RAM/process-count history, pause/failure markers and explicit process-name-free JSON history export to the optional standalone System Monitor with CPU/physical-memory/process observations, pause, filtering, sorting and reviewed local snapshot export. Missing data stays unknown; process working sets can share pages. The utility changes no process settings and is Windows-only. Export dialogs use path-only pickers, keeping existing backup/package/theme/support destinations untouched until validation and publication. Retains portable Aquarium Core 0.4.0 diagnostics probes with explicit unavailable/unsupported/unknown states, bounded background observations and safe error codes. Local support export uses the API without uploading data. Encrypted record recovery includes FishNet photo/PDF catalogs; custom media profile selectors block managed removal. Retains offline packages, versioned settings, appearance undo and previous-record recovery. Includes FishTank 0.18.0 and FishNet 0.6.3 from pinned source; FishBowl remains optional. $signature Extract the ZIP and run its single Aquarium.exe. Offline package checksums verify consistency, not independent publisher identity. Backups contain records only, not referenced games/media/saves or FishTank security data. Live UI/device acceptance and independent security review remain external checks. Standalone tools and the portable Core library package are attached. This is an initial release from the roadmap at https://chatgpt.com/share/6b08a8dd-e4a8-83e9-ab79-0f2360b34a3e ; the complete overhaul remains in progress. Tailscale is excluded."
          $notes | Set-Content release/notes.txt -Encoding utf8
          $tag = 'v' + (Get-Content release/BUILD-INFO.json -Raw | ConvertFrom-Json).version
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { return }
          gh release create $tag ./release/Aquarium-complete-windows-x64.zip ./release/SHA256SUMS.txt ./release/BUILD-INFO.json ./release/SHA256SUMS-tools.txt @toolAssets "./release/$coreName" ./release/SHA256SUMS-core.txt --target $env:GITHUB_SHA --draft --title "Aquarium $tag" --notes-file release/notes.txt
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          gh release edit $tag --draft=false --latest
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
