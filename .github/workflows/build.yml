name: Windows build and complete app bundle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Test package safety and registry persistence
        run: dotnet run --project tests/Aquarium.PackageTests/Aquarium.PackageTests.csproj -c Release
      - name: Test workspace process lifecycle
        run: dotnet run --project tests/Aquarium.HostingTests/Aquarium.HostingTests.csproj -c Release
      - name: Publish Aquarium
        run: msbuild src/Aquarium/Aquarium.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir=${{ github.workspace }}/artifacts/Aquarium/
      - uses: actions/checkout@v4
        with:
          repository: KailanBess/FishNet
          ref: b02b61b4afcc1d4805168e936804419a86405b9c
          path: companion/FishNet
      - name: Publish included FishNet build
        run: msbuild companion/FishNet/src/FishNet/FishNet.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir=${{ github.workspace }}/artifacts/FishNet/
      - uses: actions/checkout@v4
        with:
          repository: KailanBess/FishTank
          ref: 5bdf25aeb7a19c5691f0022b9db0c73b4332675e
          path: companion/FishTank
      - name: Build included FishTank workspace
        run: dotnet build companion/FishTank/desktop/FishTank.csproj -c Release
      - name: Collect FishTank program files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/FishTank | Out-Null
          Copy-Item companion/FishTank/desktop/bin/Release/net48/* artifacts/FishTank/ -Recurse -Force
      - name: Include default apps from inspected sources
        shell: pwsh
        run: ./scripts/Bundle-Apps.ps1 -PublishDirectory "$PWD/artifacts/Aquarium" -FishNetDirectory "$PWD/artifacts/FishNet" -FishTankDirectory "$PWD/artifacts/FishTank"
      - uses: actions/upload-artifact@v4
        with:
          name: Aquarium-complete-windows-x64
          path: artifacts/Aquarium/
          if-no-files-found: error
          retention-days: 14



